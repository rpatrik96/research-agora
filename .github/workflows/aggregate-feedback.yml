name: Aggregate Feedback

# RFC-0001 M2: weekly roll-up of skill-feedback issues into
# registry/feedback.json via a bot PR (human merges; the PR body is the digest).
#
# Guarantees:
# - NEVER pushes to main: output lands on a feedback/aggregate-* branch and
#   is opened as a PR that a human reviews and merges. Pair this with branch
#   protection on main (require PRs + passing checks) for hard enforcement.
# - Validates in-workflow: PRs created with the default GITHUB_TOKEN do not
#   trigger other workflows (anti-recursion), so ci.yml will NOT run on the
#   bot PR — tests/test_feedback.py therefore runs HERE, before the PR opens.
#
# Merging the bot PR: the same anti-recursion rule means the required status
# checks never appear on it, and a ruleset with no bypass actors then blocks
# the merge (`--admin` included). Push any commit to the aggregation branch
# from a human account to fire CI, then merge normally; a squash merge leaves
# no trace of it. Supplying a PAT to the `gh pr create` step would arm the
# checks automatically, at the cost of storing a token with write scope.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write # label bootstrap; reading issues is included
  pull-requests: write

concurrency:
  group: aggregate-feedback
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure skill-feedback label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create skill-feedback \
            --repo "${{ github.repository }}" \
            --description "RFC-0001 feedback report (issue) / aggregation (PR)" \
            --color 5319e7 || true

      - name: Aggregate feedback reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/aggregate-feedback.py --from-github | tee digest.md

      - name: Validate the new aggregate (bot PRs get no CI runs)
        run: |
          pip install pytest pyyaml
          pytest tests/test_feedback.py -q

      - name: Open aggregation PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet registry/feedback.json; then
            echo "No changes to registry/feedback.json — nothing to do."
            exit 0
          fi
          branch="feedback/aggregate-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add registry/feedback.json
          git commit -m "chore(feedback): weekly aggregation of skill-feedback reports"
          git push -u origin "$branch"
          gh pr create \
            --title "chore(feedback): weekly feedback aggregation" \
            --body-file digest.md \
            --label skill-feedback
