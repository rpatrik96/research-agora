repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Run pytest tests
  - repo: local
    hooks:
      # Mirrors the CI invocation in .github/workflows/ci.yml. The synthetic
      # scenarios need playwright and a generated site, so running them here
      # fails every commit on a normal dev machine; CI runs them on main only.
      - id: pytest
        name: pytest
        entry: pytest -m "not synthetic"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
